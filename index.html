<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser</title>
    <link rel="stylesheet" href="theme-toggle.css" />
</head>
<body>
    <div class="container">
        <div class="center">
            <form id="urlForm">
                <input id="urlInput" placeholder="Search Google or enter URL"
                       enterkeyhint="go" autocomplete="off" autocapitalize="off">
            </form>
        </div>

        <div class="middle">
            <form id="searchForm">
                <input id="googleInput" placeholder="Search Google"
                       enterkeyhint="search" autocomplete="off">
            </form>
        </div>

        <div class="right">
            <button id="homeButton" type="button">🏠</button>
            <button id="tabButton" type="button">
                <img src="https://images.unsplash.com/vector-1761061372075-6eebc69c6bb7?w=400&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3Dh" alt="Tabs">
            </button>
        </div>
    </div>

<style>
body {
    background-image: url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D");
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    background-attachment: fixed;
    min-height: 100vh;
    margin: 0;
    font-family: system-ui, sans-serif;
}

.center { width: 100%; }

.center input,
.middle input {
    width: 100%;
    padding: 12px;
    border: 2px solid #4C8BF5;
    border-radius: 75px;
    box-sizing: border-box;
    font-size: 16px; /* stops iOS/Android zooming in on focus */
}

.middle {
    width: min(300px, 80%);
    margin: 40vh auto 0;
}

.right {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 20; /* above the iframe (10) */
    display: flex;
    gap: 10px;
}

.right button {
    width: 45px;
    height: 45px;
    padding: 0;
    border: none;
    border-radius: 50%;
    overflow: hidden;
    cursor: pointer;
    background: white;
}

.right img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

#homeButton {
    font-size: 22px;
    line-height: 45px;
}
</style>

<script>
    const urlForm = document.getElementById("urlForm");
    const searchForm = document.getElementById("searchForm");
    const urlInput = document.getElementById("urlInput");
    const googleInput = document.getElementById("googleInput");
    const homeButton = document.getElementById("homeButton");
    const tabButton = document.getElementById("tabButton");
    const middleBox = document.querySelector(".middle");

    // Page area below the top bar
    const page = document.createElement("iframe");
    Object.assign(page.style, {
        display: "none",
        position: "fixed",
        top: "50px",
        left: "0",
        width: "100%",
        height: "calc(100vh - 50px)",
        border: "none",
        background: "white",
        zIndex: "10"
    });
    document.body.appendChild(page);

    function showPage(url) {
        middleBox.style.display = "none";
        page.style.display = "block";
        page.src = url;
    }

    function searchGoogle(query) {
        query = query.trim();
        if (!query) return;
        // igu=1 makes the plain Google homepage embeddable in some cases
        showPage("https://www.google.com/search?q=" + encodeURIComponent(query));
    }

    function goHome() {
        page.style.display = "none";
        page.src = "about:blank";
        middleBox.style.display = "";
        googleInput.value = "";
        urlInput.value = "";
    }

    // Middle search box
    searchForm.addEventListener("submit", function (e) {
        e.preventDefault();
        searchGoogle(googleInput.value);
        googleInput.blur(); // closes the mobile keyboard
    });

    // Top bar: URL or search
    urlForm.addEventListener("submit", function (e) {
        e.preventDefault();
        const text = urlInput.value.trim();
        if (!text) return;

        const isUrl = /^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}([/?#].*)?$/i.test(text);

        if (isUrl) {
            showPage(/^https?:\/\//i.test(text) ? text : "https://" + text);
        } else {
            searchGoogle(text);
        }
        urlInput.blur();
    });

    homeButton.addEventListener("click", goHome);

    tabButton.addEventListener("click", function () {
        console.log("Tab button clicked — tab functionality coming later.");
    });
</script>
</body>
</html>
